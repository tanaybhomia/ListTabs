<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New Tab</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="controls-area">
      <button id="add-btn">Settings</button>
    </div>

    <div class="container">
      <header>
        <h1 id="greeting">Hello</h1>
      </header>
      <div id="link-grid" class="link-grid"></div>
    </div>

    <div id="add-modal">
      <div class="modal-content">
        <div class="modal-section">
          <h3>Add Shortcut</h3>
          <input type="text" id="input-title" placeholder="label" />
          <div class="input-group">
            <input type="url" id="input-url" placeholder="https://" />
            <button id="save-btn" class="save-btn">Save</button>
          </div>
        </div>

        <div
          style="height: 1px; background: var(--accents-2); width: 100%"
        ></div>

        <div class="modal-section">
          <h3>Custom Bang</h3>
          <input type="text" id="bang-key" placeholder="!keyword" />
          <div class="input-group">
            <input type="text" id="bang-url" placeholder="search url" />
            <button id="save-bang-btn" class="save-btn">Save</button>
          </div>
        </div>

        <button id="cancel-btn">Close Settings</button>
      </div>
    </div>

    <div id="search-overlay">
      <div class="search-container">
        <input
          type="text"
          id="search-input"
          placeholder="Search..."
          spellcheck="false"
        />
        <div class="search-hint">Type to search or use !bangs</div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
