<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New Tab</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <input type="text" id="focus-trap" autofocus />

    <div class="controls-area">
      <button id="add-btn" title="Add Shortcut">+</button>
    </div>

    <main class="container">
      <header>
        <h1 id="greeting" class="fade-in">Evening</h1>
      </header>
      <div id="link-grid" class="link-grid"></div>
    </main>

    <div id="search-overlay">
      <input
        type="text"
        id="search-input"
        spellcheck="false"
        autocomplete="off"
        placeholder="Search..."
      />
      <div class="search-hint">Type to search or use !bangs (!yt, !gh, !r)</div>
    </div>

    <div id="add-modal">
      <div class="modal-content fade-in-up">
        <div class="modal-section">
          <h3>Add Shortcut</h3>
          <input type="text" id="input-title" placeholder="Label" />
          <div class="input-group">
            <input type="url" id="input-url" placeholder="https://" />
            <button id="save-btn" class="save-btn">Save</button>
          </div>
        </div>

        <div class="modal-divider"></div>

        <div class="modal-section">
          <h3>Custom Bang</h3>
          <div class="input-group">
            <input
              type="text"
              id="bang-key"
              placeholder="!w"
              style="width: 30%; flex: unset"
            />
            <input type="text" id="bang-url" placeholder="Search URL" />
            <button id="save-bang-btn" class="save-btn">Save</button>
          </div>
        </div>

        <button id="cancel-btn">Close</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
